<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Link Cleaner</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --tx: #0f172a;
      --mu: #64748b;
      --bd: #e2e8f0;
      --ac: #2563eb;
      --ac-hover: #1d4ed8;
      --ok: #16a34a;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --radius: 12px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --card: #1e293b;
        --tx: #f8fafc;
        --mu: #94a3b8;
        --bd: #334155;
        --ac: #3b82f6;
        --ac-hover: #60a5fa;
        --ok: #22c55e;
        --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      }
    }

    * {
      box-sizing: border-box;
      transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--tx);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
      padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
      display: flex;
      justify-content: center;
    }

    main {
      width: 100%;
      max-width: 600px;
      padding: 24px 0;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin: 0 0 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    nav {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      background: var(--card);
      padding: 4px;
      border-radius: var(--radius);
      border: 1px solid var(--bd);
      box-shadow: var(--shadow);
    }

    nav button {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      color: var(--mu);
      border-radius: 8px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    nav button.on {
      background: var(--ac);
      color: #fff;
    }

    section {
      display: none;
    }

    section.on {
      display: block;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
    }

    textarea, input[type=text] {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--bd);
      border-radius: 8px;
      background: var(--bg);
      color: var(--tx);
      font: inherit;
      outline: none;
    }

    textarea:focus, input[type=text]:focus {
      border-color: var(--ac);
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .out {
      word-break: break-all;
      min-height: 52px;
      padding: 12px;
      border-radius: 8px;
      background: var(--bg);
      border: 1px dashed var(--bd);
      font-family: monospace;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
    }

    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .btn {
      flex: 1;
      min-width: 100px;
      padding: 10px 16px;
      border: 0;
      border-radius: 8px;
      background: var(--ac);
      color: #fff;
      font: inherit;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn:hover {
      background: var(--ac-hover);
    }

    .btn.s {
      background: transparent;
      color: var(--ac);
      border: 1px solid var(--ac);
    }

    .btn.s:hover {
      background: rgba(37, 99, 235, 0.08);
    }

    .btn.ok {
      background: var(--ok) !important;
      color: #fff !important;
      border-color: var(--ok) !important;
    }

    label.t {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      padding: 10px 0;
      cursor: pointer;
      border-bottom: 1px solid var(--bd);
    }

    label.t:last-of-type {
      border-bottom: none;
    }

    label.t input {
      margin-top: 3px;
      width: 18px;
      height: 18px;
      accent-color: var(--ac);
      cursor: pointer;
    }

    small, .mu {
      color: var(--mu);
      font-size: 0.875rem;
    }

    #stat {
      display: block;
      margin-top: 10px;
    }

    .h a {
      display: block;
      padding: 10px 0;
      border-top: 1px solid var(--bd);
      color: var(--tx);
      word-break: break-all;
      text-decoration: none;
    }

    .h a:first-of-type {
      border-top: none;
    }

    .h b {
      background: var(--ac);
      color: #fff;
      border-radius: 99px;
      padding: 2px 8px;
      font-size: 0.75rem;
      margin-right: 8px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main>
    <h1>🔗 Link Cleaner</h1>
    
    <nav>
      <button class="on" data-t="one">Opschonen</button>
      <button data-t="bulk">Bulk</button>
      <button data-t="set">Instellingen</button>
    </nav>

    <section id="one" class="on">
      <div class="card">
        <textarea id="inp" placeholder="Plak hier een link…" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>
        <div class="row">
          <button class="btn s" id="paste">Plakken</button>
          <button class="btn s" id="clear">Wissen</button>
        </div>
      </div>

      <div class="card">
        <div class="mu" style="margin-bottom:8px; font-weight:600;">Schone link</div>
        <div class="out" id="out">–</div>
        <div class="row">
          <button class="btn" id="copy">Kopiëren</button>
          <button class="btn s" id="share">Delen</button>
          <a class="btn s" id="open" target="_blank" rel="noreferrer noopener">Openen</a>
        </div>
        <small id="stat"></small>
      </div>

      <div class="card h">
        <div class="mu" style="margin-bottom:8px; font-weight:600;">Geschiedenis (alleen deze sessie)</div>
        <div id="hist"><small>Nog niets.</small></div>
      </div>
    </section>

    <section id="bulk">
      <div class="card">
        <textarea id="bin" style="min-height:140px" placeholder="Eén link per regel (of gescheiden door komma's)" autocapitalize="off" spellcheck="false"></textarea>
        <div class="row"><button class="btn" id="bgo">Opschonen</button></div>
      </div>
      <div class="card">
        <textarea id="bout" style="min-height:140px" readonly placeholder="Resultaat"></textarea>
        <div class="row"><button class="btn" id="bcopy">Kopiëren</button></div>
      </div>
    </section>

    <section id="set">
      <div class="card">
        <label class="t">
          <input type="checkbox" id="ytShorten">
          <span>YouTube-links inkorten naar youtu.be<br><small>youtube.com/watch?v=… wordt youtu.be/…</small></span>
        </label>
        <label class="t">
          <input type="checkbox" id="ytShorts">
          <span>YouTube Shorts omzetten naar normale video-link</span>
        </label>
        <label class="t">
          <input type="checkbox" id="fxTwitter">
          <span>X/Twitter-links via fxtwitter.com (rijkere voorbeelden in chatapps)</span>
        </label>
        <label class="t">
          <input type="checkbox" id="autoCopy">
          <span>Automatisch kopiëren na opschonen</span>
        </label>
        <label class="t">
          <input type="checkbox" id="strict">
          <span>Streng: bij onbekende sites alle parameters verwijderen<br><small>Kan zoek- of filterlinks stukmaken</small></span>
        </label>
        <div style="padding-top:14px">
          <div style="margin-bottom:4px; font-weight:500;">Eigen parameters om te verwijderen (komma-gescheiden)</div>
          <input type="text" id="custom" placeholder="bijv. foo, bar" autocapitalize="off" spellcheck="false">
        </div>
        <div style="padding-top:14px">
          <div style="margin-bottom:4px; font-weight:500;">Amazon affiliate-ID (optioneel)</div>
          <input type="text" id="amazonTag" placeholder="bijv. naam-21" autocapitalize="off" spellcheck="false">
        </div>
      </div>
      <p class="mu" style="text-align:center;"><small>Alles draait lokaal in je browser. Dit bestand maakt geen enkel netwerkverzoek; links worden nergens naartoe gestuurd.</small></p>
    </section>
  </main>

  <script>
  (function(){
    'use strict';
    var $=function(i){return document.getElementById(i)};
    
    /* ---------- Instellingen ---------- */
    var S={};
    function load(){try{S=JSON.parse(localStorage.getItem('lc-settings')||'{}')}catch(e){S={}}}
    function save(){try{localStorage.setItem('lc-settings',JSON.stringify(S))}catch(e){}}
    load();
    
    ['ytShorten','ytShorts','fxTwitter','autoCopy','strict'].forEach(function(k){
      $(k).checked=!!S[k];
      $(k).addEventListener('change',function(){S[k]=$(k).checked;save();redo()});
    });
    
    $('amazonTag').value=S.amazonTag||'';
    $('custom').value=S.custom||'';
    $('custom').addEventListener('change',function(){S.custom=$('custom').value.trim();save();redo()});
    $('amazonTag').addEventListener('change',function(){S.amazonTag=$('amazonTag').value.trim();save();redo()});

    /* ---------- Opschoonlogica ---------- */
    var lastRule='';
    var TRACK=[
      /^(utm_|hsa_|pf_rd_|pd_rd_|mc_|_hs|__hs|vero_|wt_|oly_|pk_|piwik_|matomo_|ns_|at_|itm_|stm_|ss_|sb_|_branch|_kx|ga_|gad_|ig_|cx_|s_|nr_|mkw_|cmp_|afl_|aff_|tr_|ad_|yd_|mkt_|pt_|sc_|ys_|adgroup_|campaign_|kw_|rt_)/i,
      /^(fbclid|fbc|fbp|gclid|gclsrc|dclid|gbraid|wbraid|msclkid|yclid|ysclid|igshid|igsh|twclid|ttclid|li_fat_id|epik|ref_src|ref_url|mkt_tok|_ga|_gl|ocid|trk|trkid|trkcampaign|sr_share|share_id|spm|scm|ref|ref_|referrer|campaignid|adgroupid|cmpid|cmp|icid|ncid|xtor|smid|smtyp|s_cid|sc_cid|sessionid|rb_clickid|__s|ved|sxsrf|gs_lcp|sclient|aqs|sourceid|srsltid|irclickid|irgwc|clickid|click_id|aff_id|affid|aff|affiliate|adid|ad_id|_openstat|si|feature|pp|sfnsn|mibextid|fb_source|fb_ref|rcm|rdt_cid|rdt|tt_medium|tt_content|cjdata|cjevent|zanpid|s_kwcid|kw|creative|device|placement|targetid|feeditemid|loc_interest_ms|loc_physical_ms|matchtype|network|adposition|gclid_data|gclsrc_data|ml_subscriber|ml_subscriber_hash|vgo_ee|hmb_campaign|hmb_source|hmb_medium|s_object_id|fref|ref_type|sh|scm_id|spm_id_from|pvid|algo_exp_id|algo_pvid|btsid|ws_ab_test|pdp_npi|scenario|viewer_type|entry_point|is_from_id|from_id|from_type|src_vid|referring_euid|referring_guid|guccounter|guce_referrer|guce_referrer_sig|n_cid|at_medium|at_campaign|at_type|at_term|at_owner|at_custom1|at_custom2|at_custom3|at_custom4|_t|_r|checksum)$/i
    ];

    function isTrack(k){return TRACK.some(function(r){return r.test(k)})}
    function dropT(u){var d=[];u.searchParams.forEach(function(v,k){if(isTrack(k))d.push(k)});d.forEach(function(k){u.searchParams.delete(k)});return u}
    function keep(u,ks){var p=new URLSearchParams();ks.forEach(function(k){if(u.searchParams.has(k))p.set(k,u.searchParams.get(k))});u.search=p.toString();u.hash='';return u}
    function none(u){u.search='';u.hash='';return u}
    function del(u,ks){ks.forEach(function(k){u.searchParams.delete(k)});return u}

    var SP=['q','query','searchtext','search','k','keyword','text','term','s','zoek','search_query'];
    function srch(u){return /(^|\/)(search|zoek|zoeken|results|s|find|catalog|sch)(\/|$)/i.test(u.pathname)}
    function byPath(u){return srch(u)?keep(u,SP):none(u)}

    /* Doorverwijzers */
    var UNWRAP=[
      [/^google\.[a-z.]+$/,'/url',['q','url']],[/^l?m?\.facebook\.com$/,'/l.php',['u']],[/^l\.instagram\.com$/,'/',['u']],
      [/^l\.messenger\.com$/,'/l.php',['u']],[/^out\.reddit\.com$/,null,['url']],[/^youtube\.com$/,'/redirect',['q']],
      [/^slack-redir\.net$/,null,['url']],[/^steamcommunity\.com$/,'/linkfilter',['u','url']],[/^click\.linksynergy\.com$/,null,['murl']],
      [/^awin1\.com$/,null,['ued']],[/^go\.redirectingat\.com$/,null,['url']],[/^linkedin\.com$/,'/safety/go',['url']],
      [/^vk\.com$/,'/away.php',['to']],[/safelinks\.protection\.outlook\.com$/,null,['url']],[/^t\.umblr\.com$/,'/redirect',['z']],
      [/^disq\.us$/,'/url',['url']],[/^duckduckgo\.com$/,'/l',['uddg']],[/^bing\.com$/,'/ck/a',['u']],[/^l\.wl\.co$/,null,['u']],
      [/^exit\.sc$/,null,['url']],[/^href\.li$/,null,[]],[/^anrdoezrs\.net$|^tkqlhce\.com$|^jdoqocy\.com$/,null,['url']]
    ];

    function unwrap(u){
      for(var n=0;n<4;n++){
        var h=u.hostname.replace(/^(www|m)\./,''),t=null,m;
        if(/\.cdn\.ampproject\.org$/.test(h)&&(m=u.pathname.match(/^\/[cv]\/(?:s\/)?(.+)/)))t='https://'+m[1];
        else if(/^google\.[a-z.]+$/.test(h)&&(m=u.pathname.match(/^\/amp\/s\/(.+)/)))t='https://'+m[1];
        else if(h==='href.li'&&u.search.length>1)t=decodeURIComponent(u.search.slice(1).replace(/^https?%3A/i,function(x){return x}));
        else for(var i=0;i<UNWRAP.length;i++){
          var w=UNWRAP[i];
          if(w[0].test(h)&&(!w[1]||u.pathname.indexOf(w[1])===0)){
            for(var j=0;j<w[2].length&&!t;j++)t=u.searchParams.get(w[2][j]);
            if(t&&/bing\.com$/.test(h)&&/^a1/.test(t)){try{t=atob(t.slice(2).replace(/-/g,'+').replace(/_/g,'/'))}catch(e){t=null}}
            if(t)break;
          }
        }
        if(!t)break;
        try{u=new URL(t)}catch(e){break}
      }
      return u;
    }

    /* Siteregels */
    var SHOPS=/(^|\.)(walmart\.com|target\.com|costco\.com|homedepot\.com|lowes\.com|zalando\.[a-z.]+|aboutyou\.[a-z.]+|hm\.com|ikea\.com|mediamarkt\.[a-z.]+|coolblue\.[a-z.]+|bol\.com|wehkamp\.nl|lidl\.[a-z.]+|ah\.nl|jumbo\.com|decathlon\.[a-z.]+|otto\.de|zara\.com|nike\.com|adidas\.[a-z.]+|newegg\.com|wayfair\.com|marktplaats\.nl|tripadvisor\.[a-z.]+|yelp\.[a-z.]+|thuisbezorgd\.nl|takeaway\.com|bax-shop\.nl|kruidvat\.nl|etos\.nl|gamma\.nl|praxis\.nl|blokker\.nl|intertoys\.nl|expert\.nl|beslist\.nl|tweakers\.net|pricewatch\.nl)$/;
    var NEWS=/(^|\.)(nytimes\.com|theguardian\.com|bbc\.com|bbc\.co\.uk|cnn\.com|washingtonpost\.com|reuters\.com|bloomberg\.com|nos\.nl|nu\.nl|rtl\.nl|rtlnieuws\.nl|volkskrant\.nl|ad\.nl|telegraaf\.nl|nrc\.nl|trouw\.nl|parool\.nl|theverge\.com|wired\.com|techcrunch\.com|arstechnica\.com|engadget\.com|forbes\.com|businessinsider\.com|npr\.org|apnews\.com|politico\.[a-z.]+|time\.com|newsweek\.com|medium\.com|substack\.com|dev\.to|stackoverflow\.com|imgur\.com|giphy\.com|tumblr\.com|snapchat\.com|pinterest\.[a-z.]+|reddit\.com|instagram\.com|tiktok\.com|threads\.net|bsky\.app|quora\.com|vimeo\.com|dailymotion\.com|netflix\.com|imdb\.com|goodreads\.com|steampowered\.com|epicgames\.com|gog\.com|soundcloud\.com|bandcamp\.com|t\.me|discord\.gg|shein\.com|aliexpress\.[a-z.]+|etsy\.com)$/;

    var RULES=[
      ['Amazon',/(^|\.)amazon\.[a-z.]+$/,function(u){
        var m=u.pathname.match(/\/(?:dp|gp\/product|gp\/aw\/d|exec\/obidos\/ASIN)\/([A-Z0-9]{10})/i);
        if(m){var a=new URL(u.origin+'/dp/'+m[1].toUpperCase());if(S.amazonTag)a.searchParams.set('tag',S.amazonTag);return a}
        if(/^\/s\b/.test(u.pathname))return keep(u,['k','i','rh']);
        return none(u);
      }],
      ['eBay',/(^|\.)ebay\.[a-z.]+$/,function(u){
        var m=u.pathname.match(/\/itm\/(?:[^\/]+\/)?(\d{9,})/);
        return m?new URL(u.origin+'/itm/'+m[1]):keep(u,['_nkw','_sacat']);
      }],
      ['AliExpress',/(^|\.)aliexpress\.[a-z.]+$/,function(u){
        var m=u.pathname.match(/\/item\/(\d+)\.html/);
        return m?new URL(u.origin+'/item/'+m[1]+'.html'):byPath(u);
      }],
      ['Temu',/(^|\.)temu\.com$/,function(u){return u.searchParams.has('goods_id')?keep(u,['goods_id']):none(u)}],
      ['Best Buy',/(^|\.)bestbuy\.com$/,function(u){return keep(u,['skuId','q'])}],
      ['TikTok',/(^|\.)tiktok\.com$/,function(u){return del(dropT(u),['_t','_r','checksum'])}],
      ['YouTube',/^(youtube\.com|music\.youtube\.com|youtube-nocookie\.com)$/,function(u){
        var p=u.pathname,id=null,sh=p.match(/^\/shorts\/([\w-]+)/),h=u.hostname.replace(/^(www|m)\./,'');
        if(sh&&S.ytShorts)id=sh[1];else if(p==='/watch')id=u.searchParams.get('v');
        if(id){
          var k=new URLSearchParams();
          ['t','list','index'].forEach(function(x){if(u.searchParams.get(x))k.set(x,u.searchParams.get(x))});
          var o=(S.ytShorten&&h==='youtube.com')?new URL('https://youtu.be/'+id):new URL('https://'+(h==='music.youtube.com'?h:'www.youtube.com')+'/watch');
          if(o.hostname!=='youtu.be')o.searchParams.set('v',id);
          k.forEach(function(v,x){o.searchParams.set(x,v)});
          return o;
        }
        if(p==='/playlist')return keep(u,['list']);
        if(p==='/results')return keep(u,['search_query']);
        return none(u);
      }],
      ['YouTube',/^youtu\.be$/,function(u){return keep(u,['t'])}],
      ['X/Twitter',/^(twitter\.com|x\.com|fxtwitter\.com|vxtwitter\.com|fixupx\.com)$/,function(u){
        return new URL('https://'+(S.fxTwitter?'fxtwitter.com':u.hostname.replace(/^www\./,''))+u.pathname);
      }],
      ['Facebook',/^(facebook\.com|fb\.com|fb\.watch)$/,function(u){
        return /watch|permalink|story|photo|profile|groups|events/.test(u.pathname)?keep(u,['v','story_fbid','id','fbid','set','multi_permalinks']):none(u);
      }],
      ['LinkedIn',/^linkedin\.com$/,function(u){
        return /^\/jobs\/(search|collections)/.test(u.pathname)?keep(u,['currentJobId','keywords','location']):none(u);
      }],
      ['Spotify',/^open\.spotify\.com$/,function(u){u.pathname=u.pathname.replace(/^\/intl-[a-z-]+/,'');return none(u)}],
      ['Apple Music/Podcasts',/^(music|podcasts|itunes)\.apple\.com$/,function(u){return keep(u,['i'])}],
      ['Twitch',/^(twitch\.tv|clips\.twitch\.tv)$/,function(u){return keep(u,['t'])}],
      ['Wikipedia',/\.wikipedia\.org$/,function(u){u.hostname=u.hostname.replace('.m.','.');return keep(u,['title','oldid','diff','search'])}],
      ['GitHub',/^(github\.com|gist\.github\.com)$/,function(u){return del(dropT(u),['notification_referrer_id','notifications_query'])}],
      ['Google Zoeken',/^google\.[a-z.]+$/,function(u){
        if(u.pathname==='/search')return keep(u,['q','tbm','udm','tbs']);
        if(/^\/maps/.test(u.pathname))return del(u,['entry','g_ep','shorturl','skid','hl']);
        return dropT(u);
      }],
      ['Google Docs/Drive',/^(docs|drive|sheets|slides|forms)\.google\.com$/,function(u){return del(u,['usp','ouid','rtpof','sd','authuser','pli'])}],
      ['Bing',/^bing\.com$/,function(u){return keep(u,['q'])}],
      ['DuckDuckGo',/^duckduckgo\.com$/,function(u){return keep(u,['q'])}],
      ['Telegram/WhatsApp',/^(wa\.me|api\.whatsapp\.com|chat\.whatsapp\.com)$/,function(u){return keep(u,['text','phone'])}],
      ['Booking',/(^|\.)booking\.com$/,function(u){return keep(u,['checkin','checkout','group_adults','group_children','no_rooms','ss'])}],
      ['Airbnb',/(^|\.)airbnb\.[a-z.]+$/,function(u){return keep(u,['check_in','check_out','adults','children','infants','pets'])}],
      ['Winkel',SHOPS,byPath],
      ['Nieuws/media/sociaal',NEWS,byPath]
    ];

    function clean(raw){
      lastRule='';
      raw=(raw||'').trim().split(/\s+/)[0];
      if(!raw)return '';
      var u;
      try{u=new URL(raw)}catch(e){try{u=new URL('https://'+raw)}catch(e2){return raw}}
      if(!/^https?:$/.test(u.protocol))return raw;
      u=unwrap(u);
      var h=u.hostname.replace(/^(www|m|mobile|amp)\./,''),r=null;
      for(var i=0;i<RULES.length;i++){if(RULES[i][1].test(h)){r=RULES[i];break}}
      if(r){lastRule=r[0];u=r[2](u)||u}
      else if(S.strict){lastRule='Streng';none(u)}
      else{lastRule='Algemeen';dropT(u)}
      del(u,(S.custom||'').split(/[,\s]+/).filter(Boolean));
      return u.toString().replace(/\?$/,'');
    }

    /* ---------- UI ---------- */
    function toast(btn,txt){
      var o=btn.textContent;
      btn.textContent=txt;
      btn.classList.add('ok');
      setTimeout(function(){btn.textContent=o;btn.classList.remove('ok')},1500);
    }

    function copy(text,btn){
      function fb(){
        var t=document.createElement('textarea');
        t.value=text;
        t.style.position='fixed';
        t.style.opacity=0;
        document.body.appendChild(t);
        t.select();
        try{document.execCommand('copy')}catch(e){}
        document.body.removeChild(t);
      }
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).catch(fb)}else fb();
      if(btn)toast(btn,'Gekopieerd ✓');
    }

    var cur='';
    function run(raw,fromUser){
      cur=clean(raw);
      $('out').textContent=cur||'–';
      var a=$('open');
      if(cur){a.href=cur;a.style.pointerEvents=''}else{a.removeAttribute('href')}
      if(!cur){$('stat').textContent='';return}
      var diff=raw.trim().length-cur.length;
      $('stat').textContent=(diff>0?diff+' tekens verwijderd':'Link was al schoon')+' · regel: '+lastRule;
      if(fromUser){
        addHist(cur);
        if(S.autoCopy)copy(cur,$('copy'));
      }
    }

    function redo(){if($('inp').value.trim())run($('inp').value,false);}

    var hist=[];
    function addHist(l){
      if(hist[0]===l)return;
      hist.unshift(l);hist=hist.slice(0,30);
      var box=$('hist');box.innerHTML='';
      hist.forEach(function(x){
        var a=document.createElement('a');a.href=x;a.target='_blank';a.rel='noreferrer noopener';
        var b=document.createElement('b');
        try{b.textContent=new URL(x).hostname.replace(/^www\./,'')}catch(e){b.textContent='link'}
        a.appendChild(b);a.appendChild(document.createTextNode(x));box.appendChild(a);
      });
    }

    $('inp').addEventListener('paste',function(){setTimeout(function(){run($('inp').value,true)},30)});
    $('inp').addEventListener('input',function(){if(!$('inp').value.trim()){run('',false)}});
    $('inp').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();run($('inp').value,true)}});

    $('paste').addEventListener('click',function(){
      if(navigator.clipboard&&navigator.clipboard.readText){
        navigator.clipboard.readText().then(function(t){$('inp').value=t;run(t,true)}).catch(function(){$('inp').focus();toast($('paste'),'Plak handmatig')});
      }else{$('inp').focus();toast($('paste'),'Plak handmatig')}
    });

    $('clear').addEventListener('click',function(){$('inp').value='';run('',false);$('inp').focus()});
    $('copy').addEventListener('click',function(){if(cur)copy(cur,$('copy'))});
    $('share').addEventListener('click',function(){
      if(!cur)return;
      if(navigator.share){navigator.share({url:cur}).catch(function(){})}else copy(cur,$('share'));
    });

    /* Bulk */
    $('bgo').addEventListener('click',function(){
      var r=$('bin').value.split(/[\n,]+/).map(function(s){return s.trim()}).filter(Boolean).map(clean);
      $('bout').value=r.join('\n');
    });
    $('bcopy').addEventListener('click',function(){if($('bout').value)copy($('bout').value,$('bcopy'))});

    /* Tabs */
    document.querySelectorAll('nav button').forEach(function(b){
      b.addEventListener('click',function(){
        document.querySelectorAll('nav button,section').forEach(function(e){e.classList.remove('on')});
        b.classList.add('on');$(b.dataset.t).classList.add('on');
      });
    });

    /* Link vanuit URL parameters */
    try{
      var q=new URLSearchParams(location.search),v=q.get('url')||q.get('text');
      if(v){var m=v.match(/https?:\/\/\S+/);$('inp').value=m?m[0]:v;run($('inp').value,true)}
    }catch(e){}
  })();
  </script>
</body>
</html>
